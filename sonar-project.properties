# =============================================================================
# SonarCloud Project Configuration
# =============================================================================

sonar.organization=Abhishek_Sunkale
sonar.projectKey=Abhishek-Sunkale
sonar.projectName=FastAPI Invoice Extractor API
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Source and Test directories
sonar.sources=app
sonar.tests=tests

# Python language specification
sonar.language=py
sonar.python.version=3.12

# Code coverage report path (generated by pytest --cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,venv/**,venv2/**,alembic/**
sonar.coverage.exclusions=tests/**,alembic/**,app/config.py
