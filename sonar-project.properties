# =============================================================================
# SonarCloud Project Configuration
# =============================================================================

sonar.organization=abhishek-sunkale
sonar.projectKey=abhishek6969_FastAPI-103
sonar.projectName=FastAPI Invoice Extractor API
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Source and Test directories (scan from root, included only app/)
sonar.sources=.
sonar.tests=tests
sonar.inclusions=app/**
sonar.exclusions=tests/**,alembic/**,venv/**,venv2/**,terraform/**
sonar.coverage.exclusions=tests/**,alembic/**,app/config.py

# Python language specification
sonar.language=py
sonar.python.version=3.12

# Code coverage report path (generated by pytest --cov)
sonar.python.coverage.reportPaths=coverage.xml
