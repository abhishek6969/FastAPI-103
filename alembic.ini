# alembic.ini — Alembic configuration file
#
# WHAT IS ALEMBIC?
# Alembic is a database migration tool for SQLAlchemy. Think of it like
# "Git for your database schema" — every schema change is a versioned file.
# Alembic tracks which migrations have been applied using a table called
# `alembic_version` that it creates automatically in your PostgreSQL database.
#
# COMMON CLI COMMANDS (run these from the project root):
#   alembic upgrade head          → Apply all pending migrations (bring DB to latest)
#   alembic downgrade -1          → Roll back the last migration
#   alembic downgrade base        → Roll back ALL migrations (empty schema)
#   alembic current               → Show which migration version the DB is on right now
#   alembic history --verbose     → List all migration files and which is applied
#   alembic revision --autogenerate -m "add_preferences_table"
#                                 → Auto-generate a new migration by comparing your
#                                   SQLAlchemy models to the actual DB schema.
#                                   Alembic diffs them and writes the SQL for you.
#
# HOW DOCKER COMPOSE USES THIS:
#   The `api` service's `command` runs `alembic upgrade head` before Uvicorn starts.
#   This guarantees the DB schema is always up-to-date without manual intervention.
#   In CI/CD pipelines, you'd do the same — run migrations as a pre-deploy step.

[alembic]
# Path to the directory containing env.py and the versions/ folder
script_location = alembic

# Template for generated migration filenames. Default uses epoch timestamp.
# We prefer a manual naming convention (001_, 002_, ...) for readability,
# so we name our files explicitly when running `alembic revision`.
# file_template = %%(rev)s_%%(slug)s

# sys.path entries prepended before import. "." = project root,
# which lets Alembic import `app.database`, `app.config`, etc.
prepend_sys_path = .

# Where Alembic looks for migration version files
version_locations = %(here)s/alembic/versions

# DATABASE URL — intentionally left blank here.
# We override this in alembic/env.py by calling app.config.get_settings(),
# which reads DATABASE_URL from the .env file via pydantic-settings.
# This avoids duplicating credentials and keeps secrets out of .ini files.
# When running Alembic from the CLI locally, ensure your .env exists at the
# project root — pydantic-settings finds it automatically.
sqlalchemy.url =


[post_write_hooks]
# Optional: run a formatter on auto-generated migration files.
# Uncomment to auto-format with ruff after `alembic revision --autogenerate`:
# hooks.on_files.type = exec
# hooks.on_files.executable = ruff
# hooks.on_files.options = format REVISION_SCRIPT_FILENAME


# ---------------------------------------------------------------------------
# Logging — controls what Alembic and SQLAlchemy print during migrations
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# Set to INFO to see every SQL statement Alembic executes during migration
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO shows migration progress messages (which revision is being applied)
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
