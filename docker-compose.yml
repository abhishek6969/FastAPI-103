services:

  # ---------------------------------------------------------------------------
  # REDIS SERVICE
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    # NOTE: Alpine is fine here — Redis is written in C, not Python.
    # There are no Python C-extension compatibility issues.
    # redis:7-alpine is genuinely tiny (~30MB) and the right choice.
    container_name: invoice-redis
    ports:
      - "6379:6379"   # expose to host so you can inspect Redis with redis-cli locally
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # POSTGRESQL DATABASE SERVICE
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: invoice-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-invoice_db}
    ports:
      - "5432:5432"   # expose to host so you can connect via DBeaver / pgAdmin / psql
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-invoice_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # FASTAPI APPLICATION SERVICE
  # ---------------------------------------------------------------------------
  api:
    build: .
    container_name: invoice-api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      # HOT-RELOAD VOLUME MOUNT
      # Maps your local project folder into the container at /app.
      # Any file you save on the host is instantly visible inside the container.
      # Combined with uvicorn --reload, code changes reflect immediately.
      - .:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
