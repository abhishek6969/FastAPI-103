name: CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  # =========================================================================
  # STAGE 1: Code Quality, Testing, SonarQube & Trivy Dependency Scan
  # =========================================================================
  quality-and-security:
    name: 1. Quality, Tests & Security Scans
    runs-on: ubuntu-latest

    steps:
      - name: 1.1 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history required for SonarQube analysis

      - name: 1.2 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 1.3 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 1.4 Lint & Code Style (Ruff)
        run: |
          ruff check app/ tests/

      - name: 1.5 Run Pytest & Generate Coverage Report
        run: |
          # Runs all 27 offline unit tests, outputs terminal summary and coverage.xml for SonarQube
          pytest -v --cov=app --cov-report=xml:coverage.xml --cov-report=term tests/

      - name: 1.6 Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: 1.7 Trivy Dependency & Secret Scan (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scanners: "vuln,secret"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1" # ❌ Fails build if CRITICAL or HIGH vulnerabilities or leaked secrets are detected

      - name: 1.8 SonarCloud Analysis (SAST & Quality Gate)
        uses: sonarsource/sonarcloud-github-action@v3
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=Abhishek_Sunkale
            -Dsonar.projectKey=Abhishek-Sunkale
            -Dsonar.sources=app
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true

  # =========================================================================
  # STAGE 2: Cached Docker Build, Trivy Image Scan & Registry Push
  # =========================================================================
  container-build-and-scan:
    name: 2. Container Build, Scan & Push
    needs: [ quality-and-security ]
    runs-on: ubuntu-latest

    steps:
      - name: 2.1 Checkout Code
        uses: actions/checkout@v4

      - name: 2.2 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 2.3 Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/fastapi-invoice-api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 2.4 Build Docker Image with GHA Cache (Local Load, No Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # Loads image into local Docker daemon so Trivy can scan it
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 2.5 Trivy Container Image Scan (Pre-Push Gate)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1" # ❌ Fails build if container image has unfixed CRITICAL or HIGH CVEs

      - name: 2.6 Log in to Docker Hub
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 2.7 Push Verified Image to Docker Hub (Using Cache)
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

